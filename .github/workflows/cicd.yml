name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # AWS: STORAGE_CREDENTIALS la JSON
        #   {"aws_access_key_id": "...", "aws_secret_access_key": "...", "region": "ap-southeast-1"}
        # Tung gia tri duoc add-mask de khong lo ra log.
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json, os

          c = json.loads(os.environ["STORAGE_CREDENTIALS"])
          env = {
              "AWS_ACCESS_KEY_ID": c["aws_access_key_id"],
              "AWS_SECRET_ACCESS_KEY": c["aws_secret_access_key"],
              "AWS_DEFAULT_REGION": c.get("region", "us-east-1"),
          }
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for k, v in env.items():
                  if k != "AWS_DEFAULT_REGION":
                      print(f"::add-mask::{v}")
                  f.write(f"{k}={v}
")
          PYEOF

      - name: Pull data with DVC
        # Chi pull train_batch1 va holdout (khong can train_batch2)
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Detailed precision/recall report
        # Bonus 3: confusion matrix + precision/recall theo lop -> outputs/detail.txt
        run: |
          python src/report_detail.py
          cat outputs/detail.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1_score = $F1"
          echo "f1=$F1" >> "$GITHUB_OUTPUT"

      - name: Upload model to Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          s3 = boto3.client("s3")
          bucket = os.environ["ARTIFACT_BUCKET"]
          s3.upload_file("models/model.joblib", bucket, "artifacts/current/model.joblib")
          s3.upload_file("outputs/report.json", bucket, "artifacts/current/report.json")
          print("Da upload model.joblib va report.json len s3://%s/artifacts/current/" % bucket)
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65, dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            # serve.py tai model khi khoi dong nen can doi mot luc truoc khi health check
            sleep 5
            for i in 1 2 3 4 5 6; do
              if curl -sf http://localhost:8080/healthz; then
                echo
                echo "Health check passed."
                exit 0
              fi
              echo "Health check lan $i that bai, thu lai sau 5 giay..."
              sleep 5
            done
            echo "Health check that bai."
            sudo journalctl -u income-api -n 30 --no-pager
            exit 1
